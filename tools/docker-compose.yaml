services:
  postgres:
    image: postgres
    container_name: a2matex-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-a2matex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a2matex}
      POSTGRES_DB: ${POSTGRES_DB:-a2matex}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
