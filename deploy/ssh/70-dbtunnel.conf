# Cài vào /etc/ssh/sshd_config.d/70-dbtunnel.conf trên VPS (spec 003), rồi
# "sudo sshd -t && sudo systemctl reload ssh".
#
# User dbtunnel chỉ dùng để mở SSH tunnel tới Redis trên loopback của VPS.
# Shell của user là /usr/sbin/nologin; khoá của từng người nằm trong
# /home/dbtunnel/.ssh/authorized_keys (quản lý bằng deploy/scripts/db-access.sh)
# và mỗi dòng có thêm tiền tố restrict,port-forwarding,permitopen="127.0.0.1:6379".
Match User dbtunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:6379
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PasswordAuthentication no
