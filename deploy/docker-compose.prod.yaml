# Production stack. Images are built by GitHub Actions and pulled from GHCR;
# nothing is built on the VPS. IMAGE_REPO and IMAGE_TAG come from .env.production
# and .env.deploy (written by deploy/vps-deploy.sh on every deploy).
#
# Postgres is NOT part of this stack. It runs on Cloud SQL and every job reaches it
# through DATABASE_URL over the VPC private IP (specs/004-cloud-sql-postgres). Only
# Redis stays local. Services that talk to Postgres must also join the `edge`
# network: `backend` is internal and has no route to the VPC.
#
# `app`, `cron`, and `consumer` run the same image with different commands, so one
# deploy always moves all processes to the same tag.
name: a2matex

x-app-image: &app-image ${IMAGE_REPO:-ghcr.io/a2matex/a2matex-be}:${IMAGE_TAG:-latest}

services:
  redis:
    image: redis:7-alpine
    container_name: a2matex-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Loopback only, so the dbtunnel SSH user can forward to it (runbook A10.2).
    # Never bind 0.0.0.0 here: the cloud firewall has no rule for 6379 on purpose.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - edge

  # One-shot job: applies pending migrations against Cloud SQL, then exits. The app
  # only starts after it succeeds, so a failed migration leaves the previous app running.
  migrate:
    image: *app-image
    container_name: a2matex-migrate
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy', '--config', 'prisma7.config.ts']
    env_file:
      - ../.env.production
    environment:
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      CHECKPOINT_DISABLE: '1'
    networks:
      - backend
      - edge

  app:
    image: *app-image
    container_name: a2matex-app
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  # Scheduled jobs (spec 005). Same image and env as `app`, started with the cron
  # entry point. Internal only: no published port and no Caddy route; the deploy
  # script waits for its health check just like the API's.
  cron:
    image: *app-image
    container_name: a2matex-cron
    restart: unless-stopped
    command: ['node', 'dist/cron/main.js']
    env_file:
      - ../.env.production
    environment:
      # Pins the port the process listens on to the one the health check below probes,
      # even when .env.production does not set CRON_PORT (the app default is 3001).
      CRON_PORT: ${CRON_PORT:-9998}
    # Must exceed CRON_SHUTDOWN_GRACE_SECONDS (30 by default) so an in-flight job can
    # finish after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 45s
    # The Dockerfile HEALTHCHECK probes ${PORT} (the API port), so the cron container
    # declares its own probe on CRON_PORT.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://127.0.0.1:$${CRON_PORT:-9998}/$${API_PREFIX:-api/v1}/health" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  # Queue handlers run outside the API process. The port is internal and exists
  # only for the deployment health check; Caddy never routes traffic to it.
  consumer:
    image: *app-image
    container_name: a2matex-consumer
    restart: unless-stopped
    command: ['node', 'dist/consumer/main.js']
    env_file:
      - ../.env.production
    environment:
      KAFKA_CLIENT_ID: a2matex-consumer
      QUEUE_CONSUMER_PORT: ${QUEUE_CONSUMER_PORT:-9997}
    stop_grace_period: 45s
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS "http://127.0.0.1:$${QUEUE_CONSUMER_PORT:-9997}/health" || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2-alpine
    container_name: a2matex-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      APP_UPSTREAM: app:${PORT:-9999}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - edge

  # Manual jobs. Never started by `up`; run explicitly:
  #   docker compose ... --profile seed run --rm seed-roles
  #   docker compose ... --profile seed run --rm seed-permissions
  seed-roles:
    image: *app-image
    profiles: ['seed']
    restart: 'no'
    command: ['npx', 'tsx', 'src/seed/create-role.ts']
    env_file:
      - ../.env.production
    networks:
      - backend
      - edge

  seed-permissions:
    image: *app-image
    profiles: ['seed']
    restart: 'no'
    command: ['npx', 'tsx', 'src/seed/create-permissions.ts']
    env_file:
      - ../.env.production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge:
