# Production stack. Images are built by GitHub Actions and pulled from GHCR;
# nothing is built on the VPS. IMAGE_REPO and IMAGE_TAG come from .env.production
# and .env.deploy (written by deploy/vps-deploy.sh on every deploy).
#
# Postgres is NOT part of this stack. It runs on Cloud SQL and every job reaches it
# through DATABASE_URL over the VPC private IP (specs/004-cloud-sql-postgres). Only
# Redis stays local. Services that talk to Postgres must also join the `edge`
# network: `backend` is internal and has no route to the VPC.
#
# `app`, `cron`, and `consumer` run the same image with different commands, so one
# deploy always moves all processes to the same tag.
name: a2matex

x-app-image: &app-image ${IMAGE_REPO:-ghcr.io/a2matex/a2matex-be}:${IMAGE_TAG:-latest}

services:
  redis:
    image: redis:7-alpine
    container_name: a2matex-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Loopback only, so the dbtunnel SSH user can forward to it (runbook A10.2).
    # Never bind 0.0.0.0 here: the cloud firewall has no rule for 6379 on purpose.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - edge

  # Kafka broker, KRaft single node (specs/006-kafka-broker-deployment). Internal
  # only: no published port and no PLAINTEXT_HOST listener, so nothing outside the
  # `backend` network can reach it. Replication factor 1 everywhere: one broker on
  # one VM, so replicas would buy no durability.
  kafka:
    image: apache/kafka:4.4.0
    container_name: a2matex-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The image defaults to -Xmx1G and grows to ~620 MiB of anonymous memory under
      # load; mem_limit below is what actually forces reclaim (measured 338 -> 198 MiB).
      KAFKA_HEAP_OPTS: '-Xmx768m -Xms256m'
      # retention.bytes defaults to -1 (unlimited), which is how a 20 GB disk fills.
      # 256 MB x 4 topics x 1 partition stays well under the 2 GB budget.
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_RETENTION_HOURS: 168
      # Defaults to 50 and CANNOT be changed once __consumer_offsets exists; at 50 a
      # single consumer group took the data dir from 33 to 283 files.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 8
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Probes 29092, NOT 9092: tools/docker-compose.yaml can probe 9092 because it
      # publishes a PLAINTEXT_HOST listener there. This file drops that listener, so a
      # copied 9092 probe leaves the broker running but never healthy.
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  # One-shot job: creates the business topics at the production prefix, then exits.
  # vps-deploy.sh runs it explicitly before `up -d` so a failure leaves the running
  # stack untouched; `up -d` then runs it a second time, which --if-not-exists makes
  # harmless. Same shape as `migrate`.
  kafka-init:
    image: apache/kafka:4.4.0
    container_name: a2matex-kafka-init
    restart: 'no'
    environment:
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX}
    # $$ keeps the expansion for the container shell instead of compose, so the
    # :? guard fails this job (and the deploy) rather than silently creating
    # ".submission.scan.requested" at an empty prefix.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        : "$${KAFKA_TOPIC_PREFIX:?KAFKA_TOPIC_PREFIX is required}"
        for topic in \
          "$${KAFKA_TOPIC_PREFIX}.submission.scan.requested" \
          "$${KAFKA_TOPIC_PREFIX}.submission.scan.requested.dlq" \
          "$${KAFKA_TOPIC_PREFIX}.product-release.build.requested" \
          "$${KAFKA_TOPIC_PREFIX}.product-release.build.requested.dlq"
        do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  # One-shot job: applies pending migrations against Cloud SQL, then exits. The app
  # only starts after it succeeds, so a failed migration leaves the previous app running.
  migrate:
    image: *app-image
    container_name: a2matex-migrate
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy', '--config', 'prisma7.config.ts']
    env_file:
      - ../.env.production
    environment:
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      CHECKPOINT_DISABLE: '1'
    networks:
      - backend
      - edge

  app:
    image: *app-image
    container_name: a2matex-app
    restart: unless-stopped
    env_file:
      - ../.env.production
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  # Scheduled jobs (spec 005). Same image and env as `app`, started with the cron
  # entry point. Internal only: no published port and no Caddy route; the deploy
  # script waits for its health check just like the API's.
  cron:
    image: *app-image
    container_name: a2matex-cron
    restart: unless-stopped
    command: ['node', 'dist/cron/main.js']
    env_file:
      - ../.env.production
    environment:
      # Pins the port the process listens on to the one the health check below probes,
      # even when .env.production does not set CRON_PORT (the app default is 3001).
      CRON_PORT: ${CRON_PORT:-9998}
    # Must exceed CRON_SHUTDOWN_GRACE_SECONDS (30 by default) so an in-flight job can
    # finish after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 45s
    # The Dockerfile HEALTHCHECK probes ${PORT} (the API port), so the cron container
    # declares its own probe on CRON_PORT.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://127.0.0.1:$${CRON_PORT:-9998}/$${API_PREFIX:-api/v1}/health" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  # Queue handlers run outside the API process. The port is internal and exists
  # only for the deployment health check; Caddy never routes traffic to it.
  consumer:
    image: *app-image
    container_name: a2matex-consumer
    restart: unless-stopped
    command: ['node', 'dist/consumer/main.js']
    env_file:
      - ../.env.production
    environment:
      KAFKA_CLIENT_ID: a2matex-consumer
      QUEUE_CONSUMER_PORT: ${QUEUE_CONSUMER_PORT:-9997}
    stop_grace_period: 45s
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS "http://127.0.0.1:$${QUEUE_CONSUMER_PORT:-9997}/health" || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Stronger than waiting on `kafka` being healthy: subscribing to a topic that
      # does not exist is a hard error (allowAutoTopicCreation is false), so the
      # consumer must not start until the topics are provisioned. `app` deliberately
      # has no Kafka dependency - it only throws when publish() is called, so a dead
      # broker must not take the API down with it.
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  # Read-only Kafka UI, reached only through Caddy. Joins BOTH networks: `backend`
  # to talk to the broker (that network is internal:true) and `edge` because Caddy
  # lives there. No published port - the subdomain is the only way in.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: a2matex-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: a2matex-production
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Verified: /api/clusters reports readOnly true and a topic-create POST returns
      # 405 ReadOnlyModeException. The UI sits on a public address behind only basic
      # auth and can read every message body, so it gets no write path.
      KAFKA_CLUSTERS_0_READONLY: 'true'
      DYNAMIC_CONFIG_ENABLED: 'false'
      # The image ships no heap flag, so the JVM would take 25% of host RAM (~950 MB
      # on this VM). JAVA_OPTS replaces the image default, so --add-opens must stay.
      JAVA_OPTS: '--add-opens java.rmi/javax.rmi.ssl=ALL-UNNAMED -Xmx256m'
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2-alpine
    container_name: a2matex-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      APP_UPSTREAM: app:${PORT:-9999}
      # Adding these recreates the caddy container once (~1-2s), because compose
      # injects environment at container creation, not at `exec`. Later Caddyfile-only
      # edits can use `exec caddy reload`, which is zero-downtime.
      KAFKA_UI_DOMAIN: ${KAFKA_UI_DOMAIN}
      KAFKA_UI_UPSTREAM: ${KAFKA_UI_UPSTREAM}
      KAFKA_UI_USER: ${KAFKA_UI_USER}
      # Must carry doubled "$$" in .env.production or compose interpolation eats it.
      KAFKA_UI_PASSWORD_HASH: ${KAFKA_UI_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - edge

  # Manual jobs. Never started by `up`; run explicitly:
  #   docker compose ... --profile seed run --rm seed-roles
  #   docker compose ... --profile seed run --rm seed-permissions
  seed-roles:
    image: *app-image
    profiles: ['seed']
    restart: 'no'
    command: ['npx', 'tsx', 'src/seed/create-role.ts']
    env_file:
      - ../.env.production
    networks:
      - backend
      - edge

  seed-permissions:
    image: *app-image
    profiles: ['seed']
    restart: 'no'
    command: ['npx', 'tsx', 'src/seed/create-permissions.ts']
    env_file:
      - ../.env.production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  kafka-data:

networks:
  backend:
    internal: true
  edge:
